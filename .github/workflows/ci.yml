name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build & xUnit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  web:
    name: Web frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vue3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/vue3/package-lock.json
      - name: Install
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end · Cypress against the real API
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/vue3/package-lock.json
      - name: Start API (http://localhost:8081)
        working-directory: apps/dotnet/src/Api
        run: |
          nohup dotnet run --urls http://localhost:8081 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8081/api/tags > /dev/null && echo "API is up" && exit 0
            sleep 2
          done
          echo "API did not start"; cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Install web dependencies
        working-directory: apps/vue3
        run: npm ci
      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: apps/vue3
          install: false
          start: npm run dev -- --port 5173 --strictPort
          wait-on: http://localhost:5173
          wait-on-timeout: 120
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: apps/vue3/cypress/screenshots
          if-no-files-found: ignore
      - name: API log
        if: always()
        run: cat "$RUNNER_TEMP/api.log" || true

  flutter:
    name: Mobile app · Flutter tests & web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.19.6
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Widget tests
        run: flutter test
      - name: Build web
        run: flutter build web --release
